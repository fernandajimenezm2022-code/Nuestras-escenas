<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Nahomi 💕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* El video ocupa toda la pantalla */
    .video-full {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* contain = se ve completo, sin recortar (deja franjas negras si no es la misma proporción) */
    .video-full video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* Botón abajo, centrado */
    #start-btn {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffb6c1;
      color: #0d0d1a;
      border: none;
      padding: 14px 28px;
      border-radius: 30px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 5px 15px rgba(255,182,193,0.4);
    }
  </style>
</head>
<body>

  <div class="video-full">
    <video id="main-video" muted loop playsinline>
      <source src="mi Video 2026-09-14 at 9.45.14 PM.mp4" type="video/mp4">
      Tu navegador no soporta el video.
    </video>
  </div>

  <button id="start-btn">▶️ Iniciar video</button>

  <script>
    const video = document.getElementById('main-video');
    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', () => {
      video.muted = false;
      video.play();
      startBtn.style.display = 'none';
    });
  </script>
</body>
</html>
