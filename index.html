<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Nahomi 💕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d0d1a;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Pantalla de "gira tu teléfono" */
    #rotate-warning {
      position: fixed;
      inset: 0;
      background: #0d0d1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      z-index: 999;
      padding: 20px;
    }
    #rotate-warning .phone {
      font-size: 60px;
      margin-bottom: 15px;
      animation: shake 1.5s infinite;
    }
    #rotate-warning h2 { font-size: 22px; margin-bottom: 8px; }
    #rotate-warning p { font-size: 15px; color: #aaa; }

    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(90deg); }
      75% { transform: rotate(90deg); }
    }

    /* Sección del video */
    #video-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    .video-box {
      width: 90%;
      max-width: 400px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .video-box video {
      width: 100%;
      display: block;
    }

    /* Botón para iniciar el video (necesario en celulares) */
    #start-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ffb6c1;
      color: #0d0d1a;
      border: none;
      padding: 12px 18px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 5px 15px rgba(255,182,193,0.4);
    }

    @media (orientation: landscape) {
      #rotate-warning { display: flex; }
    }
    @media (orientation: portrait) {
      #rotate-warning { display: none; }
    }
  </style>
</head>
<body>

  <!-- Aviso de girar el teléfono -->
  <div id="rotate-warning">
    <div class="phone">📱</div>
    <h2>¡Gira tu teléfono!</h2>
    <p>Ponlo en horizontal para verlo mejor 💕</p>
  </div>

  <!-- Botón para iniciar el video -->
  <button id="start-btn">▶️ Iniciar video</button>

  <!-- Video -->
  <section id="video-section">
    <div class="video-box">
      <video id="main-video" muted loop playsinline>
        <source src="WhatsApp Video 2026-09-13 at 9.32.33 PM.mp4" type="video/mp4">
        Tu navegador no soporta el video.
      </video>
    </div>
  </section>

  <script>
    // Iniciar el video al tocar el botón (los celulares no dejan que suene solo)
    const video = document.getElementById('main-video');
    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', () => {
      video.muted = false;
      video.play();
      startBtn.style.display = 'none';
    });

    // Ocultar el aviso de girar cuando esté en vertical
    window.addEventListener('resize', () => {
      const warn = document.getElementById('rotate-warning');
      warn.style.display = (window.innerHeight > window.innerWidth) ? 'none' : 'flex';
    });
  </script>
</body>
</html>
