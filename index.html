<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Nahomi 💕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      background: #000;
      overflow: hidden;
    }

    /* El video ocupa toda la pantalla */
    .video-full {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }

    /* contain = se ve completo, sin recortar */
    .video-full video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none; /* para que el toque vaya a la pantalla, no al video */
    }

    /* Mensajito de "toca para pausar" abajo */
    #hint {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      font-family: 'Segoe UI', Arial, sans-serif;
      z-index: 100;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>

  <div class="video-full" id="screen">
    <video id="main-video" muted loop playsinline>
      <source src="mi Video 2026-09-14 at 9.45.14 PM.mp4" type="video/mp4">
      Tu navegador no soporta el video.
    </video>
  </div>

  <div id="hint">Toca la pantalla para pausar / reanudar 💕</div>

  <script>
    const video = document.getElementById('main-video');
    const screen = document.getElementById('screen');
    const hint = document.getElementById('hint');

    // Primer toque: inicia el video con sonido
    // Toques siguientes: pausa o reanuda
    screen.addEventListener('click', () => {
      if (video.paused) {
        video.muted = false;
        video.play();
        hint.style.display = 'none';
      } else {
        video.pause();
        hint.textContent = 'Toca para reanudar ▶️';
      }
    });
  </script>
</body>
</html>
