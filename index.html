<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Nahomi 💕</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0d0d1a;
      color: #fff;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Sección del video */
    #video-section {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 20px;
    }

    .video-box {
      width: 90%;
      max-width: 400px;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .video-box video {
      width: 100%;
      display: block;
    }

    /* Botón para iniciar el video (necesario en celulares) */
    #start-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: #ffb6c1;
      color: #0d0d1a;
      border: none;
      padding: 12px 18px;
      border-radius: 30px;
      font-weight: bold;
      cursor: pointer;
      z-index: 100;
      box-shadow: 0 5px 15px rgba(255,182,193,0.4);
    }
  </style>
</head>
<body>

  <!-- Botón para iniciar el video -->
  <button id="start-btn">▶️ Iniciar video</button>

  <!-- Video -->
  <section id="video-section">
    <div class="video-box">
      <video id="main-video" muted loop playsinline>
        <source src="WhatsApp Video 2026-09-13 at 9.32.33 PM.mp4" type="video/mp4">
        Tu navegador no soporta el video.
      </video>
    </div>
  </section>

  <script>
    // Iniciar el video al tocar el botón
    const video = document.getElementById('main-video');
    const startBtn = document.getElementById('start-btn');
    startBtn.addEventListener('click', () => {
      video.muted = false;
      video.play();
      startBtn.style.display = 'none';
    });
  </script>
</body>
</html>
